<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Online DRM|HLS Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Material+Icons+Round&display=swap" rel="stylesheet">
    
    <script src="https://ssl.p.jwpcdn.com/player/v/8.32.1/jwplayer.js" type="text/javascript"></script>
    <script>jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';</script>

    <script>
        // 1. Fetch API Interceptor
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const requestUrl = typeof args[0] === 'string' ? args[0] : (args[0] ? args[0].url : '');
            let response = await originalFetch.apply(this, args);
            
            if (requestUrl && requestUrl.includes('.mpd')) {
                try {
                    let text = await response.clone().text();
                    // Surgically delete Widevine & PlayReady PSSH payloads that crash JW Player
                    text = text.replace(/<ContentProtection[^>]*urn:uuid:edef8ba9-79d6-4ace-a3c8-27dcd51d21ed[^>]*>[\s\S]*?<\/ContentProtection>/gi, '<ContentProtection schemeIdUri="urn:uuid:e2719d58-a985-b3c9-781a-b030af78d30e"></ContentProtection>');
                    text = text.replace(/<ContentProtection[^>]*urn:uuid:9a04f079-9840-4286-ab92-e65be0885f95[^>]*>[\s\S]*?<\/ContentProtection>/gi, '');
                    return new Response(text, { status: response.status, statusText: response.statusText, headers: response.headers });
                } catch (err) { console.error('Fetch intercept failed:', err); }
            }
            return response;
        };

        // 2. XMLHttpRequest (XHR) Interceptor (Fallback for older JW Player networking)
        const originalXhrOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
            this._reqUrl = typeof url === 'string' ? url : url.href;
            return originalXhrOpen.apply(this, arguments);
        };
        const originalXhrSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function() {
            this.addEventListener('readystatechange', function() {
                if (this.readyState === 4 && this._reqUrl && this._reqUrl.includes('.mpd')) {
                    try {
                        let originalText = this.responseText;
                        if (originalText) {
                            let newText = originalText.replace(/<ContentProtection[^>]*urn:uuid:edef8ba9-79d6-4ace-a3c8-27dcd51d21ed[^>]*>[\s\S]*?<\/ContentProtection>/gi, '<ContentProtection schemeIdUri="urn:uuid:e2719d58-a985-b3c9-781a-b030af78d30e"></ContentProtection>');
                            newText = newText.replace(/<ContentProtection[^>]*urn:uuid:9a04f079-9840-4286-ab92-e65be0885f95[^>]*>[\s\S]*?<\/ContentProtection>/gi, '');
                            Object.defineProperty(this, 'responseText', { writable: true, value: newText });
                            Object.defineProperty(this, 'response', { writable: true, value: newText });
                        }
                    } catch(e) {}
                }
            });
            return originalXhrSend.apply(this, arguments);
        };
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #090514);
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(15, 11, 28, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        #playerWrapper {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        /* Forces JW Player elements to completely fill the workspace container */
        .jwplayer, .jw-video, .jw-media, .jw-main-container {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

    <header class="w-full max-w-6xl mx-auto px-4 pt-6 pb-2 text-center">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent drop-shadow-sm">
            Online DRM|HLS Player
        </h1>
        <p class="text-sm md:text-base text-gray-400 mt-2 font-medium">
            Developed by 
            <a href="https://www.facebook.com/NasimAktar786" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:text-indigo-300 transition-colors duration-200 underline underline-offset-4 decoration-indigo-500/50">
                Nasim Aktar
            </a>
        </p>
    </header>

    <main class="w-full max-w-5xl mx-auto px-4 flex-grow flex flex-col gap-6 justify-center items-center my-4">
        
        <div class="w-full glass-panel rounded-2xl p-4 md:p-6 shadow-2xl transition-all duration-300">
            <div class="mb-4">
                <label for="streamUrl" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Streaming Manifest Link</label>
                <div class="relative flex flex-col sm:flex-row gap-3">
                    <input type="text" id="streamUrl" 
                           placeholder="Paste URL (e.g., https://...manifest.mpd?|drmScheme=clearkey&drmLicense=KID:KEY)" 
                           class="w-full bg-black/40 border border-gray-700/60 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-gray-200 placeholder-gray-500">
                    <button id="playBtn" onclick="executeStreamRouteAction()" class="sm:w-36 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-sm px-6 py-3.5 rounded-xl flex items-center justify-center gap-2 cursor-pointer shadow-lg active:scale-98 transition-all">
                        <span class="material-icons-round text-lg">play_arrow</span> Play
                    </button>
                </div>
            </div>
            
            <div class="flex items-start gap-3 bg-indigo-950/30 border border-indigo-500/20 rounded-xl p-3.5">
                <span class="material-icons-round text-indigo-400 shrink-0 mt-0.5">info</span>
                <div class="text-xs md:text-sm text-gray-300 space-y-1">
                    <p class="font-semibold text-indigo-300">DASH and HLS with key and without also</p>
                    <p class="text-gray-400">For without key, ignore kid and key, just add stream URL and click on play</p>
                </div>
            </div>
        </div>

        <div id="playerWrapper" class="w-full relative aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800/80">
            <div id="jwPlayerContainer"></div>
        </div>
    </main>

    <footer class="w-full text-center py-6 border-t border-white/5 text-[11px] md:text-xs text-gray-500 tracking-wide font-medium">
        &copy; 2026 Core Digital Media Streaming Sandbox Engine. All Rights Reserved.
    </footer>

    <script>
        function parseStreamingMetadata(inputString) {
            let rawInput = inputString.trim().replace(/%7C/gi, '|');
            let manifestUrl = rawInput;
            let drmConfig = null;
            let urlParams = null;

            if (rawInput.includes('|')) {
                let parts = rawInput.split('|');
                manifestUrl = parts[0];
                if (manifestUrl.endsWith('?')) manifestUrl = manifestUrl.slice(0, -1);
                urlParams = new URLSearchParams(parts.slice(1).join('|'));
            } else if (rawInput.includes('?')) {
                let parts = rawInput.split('?');
                let possibleParams = new URLSearchParams(parts[1]);
                if (possibleParams.has('drmScheme') || possibleParams.has('drmLicense') || possibleParams.has('kid')) {
                    manifestUrl = parts[0]; 
                    urlParams = possibleParams;
                }
            }

            if (urlParams) {
                const scheme = urlParams.get('drmScheme') || urlParams.get('drm');
                const license = urlParams.get('drmLicense') || urlParams.get('license');
                const kid = urlParams.get('kid');
                const key = urlParams.get('key');
                const cleanHex = (str) => str.trim().replace(/-/g, '');

                if (kid && key) {
                    drmConfig = { type: 'clearkey', kid: cleanHex(kid), key: cleanHex(key) };
                } else if (scheme && license) {
                    if (scheme.toLowerCase() === 'clearkey' && license.includes(':')) {
                        const licenseParts = license.split(':');
                        drmConfig = { type: 'clearkey', kid: cleanHex(licenseParts[0]), key: cleanHex(licenseParts[1]) };
                    } else if (scheme.toLowerCase() === 'clearkey') {
                        drmConfig = { type: 'license_server', scheme: 'org.w3.clearkey', url: license };
                    } else if (scheme.toLowerCase() === 'widevine') {
                        drmConfig = { type: 'license_server', scheme: 'com.widevine.alpha', url: license };
                    }
                }
            }
            return { manifestUrl, drmConfig };
        }

        function executeStreamRouteAction() {
            const rawInputValue = document.getElementById('streamUrl').value;
            if (!rawInputValue) return alert('Please supply an active video stream link first.');

            const parsedConfig = parseStreamingMetadata(rawInputValue);

            // Set up JW Player Configuration
            const playerSetup = {
                file: parsedConfig.manifestUrl,
                width: "100%",
                height: "100%",
                autostart: true,
                mute: false,
                preload: "auto",
                // Forces the video to stretch and fill the screen without black bars
                stretching: "exactFit", 
                playbackRateControls: true,
                abouttext: "Developed by Nasim Aktar",
                aboutlink: "https://www.facebook.com/NasimAktar786"
            };

            // Map the parsed DRM to JW Player natively
            if (parsedConfig.drmConfig) {
                if (parsedConfig.drmConfig.type === 'clearkey') {
                    playerSetup.drm = {
                        clearkey: {
                            keyId: parsedConfig.drmConfig.kid,
                            key: parsedConfig.drmConfig.key
                        }
                    };
                } else if (parsedConfig.drmConfig.type === 'license_server') {
                    playerSetup.drm = {};
                    if (parsedConfig.drmConfig.scheme === 'com.widevine.alpha') {
                        playerSetup.drm.widevine = { url: parsedConfig.drmConfig.url };
                    } else if (parsedConfig.drmConfig.scheme === 'com.microsoft.playready') {
                        playerSetup.drm.playready = { url: parsedConfig.drmConfig.url };
                    }
                }
            }

            // Execute the player injection
            const playerInstance = jwplayer("jwPlayerContainer").setup(playerSetup);

            // Listen for Fullscreen toggles to force Landscape rotation on Mobile
            playerInstance.on("fullscreen", function(event) {
                if (event.fullscreen) {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(() => console.warn("Rotation lock blocked"));
                    }
                } else {
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            });

            playerInstance.on("error", function(e) {
                console.error("JW Player Exception:", e);
                // Gracefully log the error without breaking the UI completely
                alert("Playback Failed: " + (e.message || "Invalid stream or DRM credentials. Error Code: " + e.code));
            });
        }
    </script>
</body>
</html>
