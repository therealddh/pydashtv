name: Run Python Script Every 30 Min

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:        # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Requirements
        run: |
          pip install requests pycryptodomex

      - name: Download and Run Script
        env:
          SCRIPT_URL: ${{ secrets.DASHTV }}
        run: |
          REAL_URL=$(python3 -c "
          import base64, os
          data = os.getenv('SCRIPT_URL_ENCODED', '').strip()
          # Add up to 2 '=' to fix padding if missing
          data += '=' * (4 - len(data) % 4) if len(data) % 4 != 0 else ''
          print(base64.b64decode(data).decode('utf-8').strip())
          ")
          curl -L $REAL_URL -o script.py
          python script.py > dashtv.m3u

      - name: Commit and Push output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashtv.m3u
          git commit -m "Update output dastv.m3u" || echo "No changes to commit"
          git push
